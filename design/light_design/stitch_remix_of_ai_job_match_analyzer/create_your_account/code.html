<div class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant rounded-xl p-xl shadow-sm">

<h1 class="font-headline-lg text-headline-lg hidden md:block text-on-surface mb-xs">Create Account</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:hidden text-on-surface mb-xs">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">

                </p>
</div>
<button class="w-full flex items-center justify-center gap-xs px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors mb-lg focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2">

<span class="flex-shrink-0 mx-sm font-label-sm text-label-sm text-outline">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<form action="#" class="space-y-md" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email</label>
<input class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder-outline" id="email" name="email" placeholder="name@example.com" required="" type="email">
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="password">Password</label>
<input class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder-outline" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<div class="pt-sm">
<button class="w-full px-md py-sm bg-primary-container text-on-primary rounded-lg font-label-md text-label-md hover:bg-opacity-90 transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2" type="submit">

                    </button>
</div>
