<h1 class="font-headline-lg text-headline-lg hidden md:block text-text-primary mb-xs">Create Account</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:hidden text-text-primary mb-xs">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">

                </p>
</div>
<button class="w-full flex items-center justify-center gap-xs px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-label-md text-label-md text-text-primary hover:bg-surface-container-low transition-colors mb-lg focus:outline-none focus:ring-2 focus:ring-accent-indigo focus:ring-offset-2">

<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>

<span class="flex-shrink-0 mx-sm font-label-sm text-label-sm text-outline">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<form action="#" class="space-y-md" method="POST">
<div>
<label class="block font-label-md text-label-md text-text-primary mb-xs" for="email">Email</label>
<input class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-text-primary focus:outline-none focus:border-accent-indigo focus:ring-1 focus:ring-accent-indigo placeholder-outline" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-text-primary mb-xs" for="password">Password</label>
<input class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-text-primary focus:outline-none focus:border-accent-indigo focus:ring-1 focus:ring-accent-indigo placeholder-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="pt-sm">
<button class="w-full px-md py-sm bg-accent-indigo text-text-primary rounded-lg font-label-md text-label-md hover:bg-opacity-90 transition-colors focus:outline-none focus:ring-2 focus:ring-accent-indigo focus:ring-offset-2 focus:ring-offset-surface-container-lowest" type="submit">

                    </button>
</div>
</form>
